apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: services
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/ashish-splite/argo-infra.git
        revision: main
        files:
          - path: "services/*/app.yaml"
      selector:
        matchExpressions:
          - key: enabled
            operator: NotIn
            values: ["false"]
  template:
    metadata:
      name: "{{ .name }}"
    spec:
      project: default
      source:
        repoURL: https://github.com/ashish-splite/argo-infra.git
        targetRevision: main
        path: "{{ .path.path }}/chart"
        helm:
          releaseName: "{{ .name }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .namespace }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
