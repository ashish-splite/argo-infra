controller:
  # Jenkins UI
  serviceType: NodePort
  nodePort: 32000

  # Don't run builds directly on the controller
  numExecutors: 0

  # Override default plugins with compatible versions
  installPlugins:
    - kubernetes:4411.v0943a_f3af8a_b_
    - workflow-aggregator:608.v67378e9d3db_1
    - git:5.7.0
    - configuration-as-code:2006.v001a_2ca_6b_574

  # Reasonable for Minikube
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "2Gi"

persistence:
  enabled: true
  size: 10Gi

# Let Jenkins create/use its Kubernetes service account
rbac:
  create: true