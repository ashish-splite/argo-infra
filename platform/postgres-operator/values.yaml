# platform/postgres-operator/values.yaml

# Operator namespace
namespaceOverride: cnpg-system

# Install CRDs with the operator
crds:
  create: true

# Single operator replica is sufficient for local Minikube
replicaCount: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
