# Run the AWS APIs needed for local External Secrets development.
startServices: secretsmanager

# 4.5.0 is the last line that runs without a LOCALSTACK_AUTH_TOKEN; 2026.x requires a licensed token.
image:
  repository: localstack/localstack
  tag: "4.5.0"
  pullPolicy: Always

service:
  type: ClusterIP

# Persistence requires a paid LocalStack plan, so state resets on pod restart.
persistence:
  enabled: false

# The persistent volume cannot be mounted by two pods during a rolling update.
updateStrategy:
  type: Recreate

ingress:
  enabled: true
  ingressClassName: nginx
  hosts:
    - host: localstack.local
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi
