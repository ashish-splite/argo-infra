# Run the AWS APIs needed for local External Secrets development.
startServices: secretsmanager

image:
  repository: localstack/localstack
  tag: "2026.8.1"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP

# Persistence is a licensed LocalStack feature; the community image exits on startup if PERSISTENCE=1.
persistence:
  enabled: false

# The persistent volume cannot be mounted by two pods during a rolling update.
updateStrategy:
  type: Recreate

ingress:
  enabled: true
  ingressClassName: nginx
  hosts:
    - host: localstack.local
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi
