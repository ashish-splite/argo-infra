# Vault runs in dev mode, so the root token is a known constant rather than a real credential.
clusterSecretStore:
  name: vault-backend
  syncWave: "1"
  provider:
    server: http://vault.vault.svc.cluster.local:8200
    path: secret
    version: v2
  credentials:
    secretName: vault-token
    key: token
    syncWave: "0"
    token: root
