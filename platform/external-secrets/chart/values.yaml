# The token Secret is created out-of-band after `vault operator init`; it is not stored in Git.
clusterSecretStore:
  name: vault-backend
  syncWave: "1"
  provider:
    server: http://vault.vault.svc.cluster.local:8200
    path: secret
    version: v2
  credentials:
    secretName: vault-token
    key: token
