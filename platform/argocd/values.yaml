# ArgoCD - GitOps Continuous Delivery
# https://argo-cd.readthedocs.io/

# Server configuration
server:
  replicas: 1
  
  # Ingress for UI access
  ingress:
    enabled: true
    ingressClassName: nginx
    hostname: argocd.local
    # TLS disabled for local dev
    tls: false
    # No special annotations needed - server runs in insecure (HTTP) mode

# Controller configuration
controller:
  replicas: 1

# Repo server
repoServer:
  replicas: 1

# ApplicationSet controller
applicationSet:
  replicas: 1

# Redis (used for caching)
redis:
  enabled: true

# Disable HA for local dev (single instance)
redis-ha:
  enabled: false

# Notifications controller
notifications:
  enabled: true

# Configs
configs:
  params:
    # Allow insecure connections (for local dev without TLS)
    server.insecure: true

  secret:
    # Local-dev only: bcrypt hash of "admin". Bump mtime to force a credential refresh.
    argocdServerAdminPassword: "$2a$10$w/hun2qt1k9LW2GxDB8tkuRMgps1m1KPgFgQaq19.1NQbW8i6Qi2u"
    argocdServerAdminPasswordMtime: "2026-09-06T23:56:46Z"
