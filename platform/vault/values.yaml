# Sidecar injection is unused; External Secrets pulls from Vault instead.
injector:
  enabled: false

server:
  # Dev mode: auto-unsealed with a known root token, but state is in-memory and lost on restart.
  dev:
    enabled: true
    devRootToken: "root"

  standalone:
    enabled: false

  dataStorage:
    enabled: false

  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - host: vault.local

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

ui:
  enabled: true
  serviceType: ClusterIP
