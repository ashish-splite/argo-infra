controller:
  # Local Minikube: one replica is enough.
  replicaCount: 1

  # The cert Job hardcodes ttlSecondsAfterFinished: 0, so it self-deletes before
  # Argo CD observes the hook finishing and the sync hangs. Ingress validation is
  # not worth that on a local cluster.
  admissionWebhooks:
    enabled: false

  # Keep the production-style Service type.
  # minikube tunnel will provide the external connectivity.
  service:
    type: LoadBalancer

  # Explicitly create/use the nginx IngressClass.
  ingressClass: nginx

  ingressClassResource:
    enabled: true
    name: nginx
    default: false
    controllerValue: k8s.io/ingress-nginx