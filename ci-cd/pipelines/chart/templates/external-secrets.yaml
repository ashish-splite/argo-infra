{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dockerhub
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.externalSecrets.dockerhub.targetSecretName }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        # Kaniko reads this file directly; no docker login step is needed.
        .dockerconfigjson: |
          {"auths":{"{{ .Values.workflow.registry }}":{"username":"{{ `{{ .username }}` }}","password":"{{ `{{ .password }}` }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.externalSecrets.dockerhub.remoteKey }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.externalSecrets.dockerhub.remoteKey }}
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.externalSecrets.github.targetSecretName }}
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.externalSecrets.github.remoteKey }}
        property: username
    - secretKey: token
      remoteRef:
        key: {{ .Values.externalSecrets.github.remoteKey }}
        property: token
{{- end }}
