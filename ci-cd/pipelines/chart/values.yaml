eventBus:
  # Must match a version listed in the argo-events controller ConfigMap.
  jetstreamVersion: "2.10.10"
  replicas: 3

externalSecrets:
  enabled: true
  refreshInterval: 1h
  secretStoreName: vault-backend
  dockerhub:
    remoteKey: ci-cd/dockerhub
    targetSecretName: dockerhub-config
  github:
    remoteKey: ci-cd/github
    targetSecretName: github-credentials

serviceAccounts:
  workflow: argo-ci-workflow
  sensor: argo-ci-sensor

workflow:
  workspaceSize: 2Gi
  images:
    kaniko: gcr.io/kaniko-project/executor:v1.23.2
    git: alpine/git:2.45.2
    yq: mikefarah/yq:4
  registry: https://index.docker.io/v1/

webhook:
  # Public URL GitHub posts to. ngrok in local dev; a real DNS name elsewhere.
  url: "https://4d2b-2406-7400-11d-d65f-b54f-13f9-e33e-bbd8.ngrok-free.app"
  path: /push
  port: 12000
  ingress:
    enabled: true
    className: nginx
  # Only the hook registration surface. Per-app CI config lives in the app's chart.
  repositories:
    - owner: ashish-splite
      names:
        - ai-agent-ts

