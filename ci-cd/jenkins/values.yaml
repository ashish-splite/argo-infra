controller:
  # Jenkins UI
  serviceType: ClusterIP  # Changed from NodePort - using Ingress instead

  # Don't run builds directly on the controller
  numExecutors: 0

  # Let Jenkins auto-resolve plugin versions
  installLatestPlugins: true
  installLatestSpecifiedPlugins: true
  installPlugins:
    - kubernetes
    - workflow-aggregator
    - git
    - configuration-as-code

  # Reasonable for Minikube
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "2Gi"

  # Ingress configuration
  ingress:
    enabled: true
    ingressClassName: nginx
    path: /jenkins
    pathType: ImplementationSpecific
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /$2
      nginx.ingress.kubernetes.io/use-regex: "true"

persistence:
  enabled: true
  size: 10Gi

# Let Jenkins create/use its Kubernetes service account
rbac:
  create: true