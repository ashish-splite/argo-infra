apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: github
spec:
  service:
    ports:
      - name: webhook
        port: {{ .Values.webhook.port }}
        targetPort: {{ .Values.webhook.port }}
  github:
    # One endpoint for every repo; Sensors discriminate on repository.full_name.
    push:
      repositories:
        {{- range .Values.webhook.repositories }}
        - owner: {{ .owner }}
          names:
            {{- range .names }}
            - {{ . }}
            {{- end }}
        {{- end }}
      webhook:
        endpoint: {{ .Values.webhook.path }}
        port: "{{ .Values.webhook.port }}"
        method: POST
        url: {{ .Values.webhook.url | quote }}
      events:
        - push
      # An apiToken is present, so argo-events registers the hooks on GitHub itself.
      apiToken:
        name: {{ .Values.externalSecrets.github.targetSecretName }}
        key: token
      contentType: json
      active: true
