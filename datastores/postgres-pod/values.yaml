# datastores/postgres-pod/values.yaml

# ------------------------------------------------------------
# Image - pinned to stable tag
# ------------------------------------------------------------
image:
  registry: docker.io
  repository: bitnami/postgresql
  tag: "latest"

# ------------------------------------------------------------
# Authentication
# ------------------------------------------------------------
auth:
  username: app
  password: "change-me"
  database: appdb

# ------------------------------------------------------------
# Primary configuration (all primary settings consolidated)
# ------------------------------------------------------------
primary:
  # Service - use different port to avoid conflict with postgres-cluster
  service:
    type: LoadBalancer
    ports:
      postgresql: 15432

  # Persistence
  persistence:
    enabled: true
    storageClass: standard
    accessModes:
      - ReadWriteOnce
    size: 5Gi

  # Resources
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 1Gi

  # PostgreSQL configuration
  extendedConfiguration: |
    max_connections = 100
    shared_buffers = 128MB

  # Pod security
  podSecurityContext:
    enabled: true

  containerSecurityContext:
    enabled: true