replicaCount: 1

image:
  repository: thedarkest22/chat-interface
  tag: "latest"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

env:
  NODE_ENV: production
  LOG_LEVEL: info

ingress:
  enabled: true
  className: nginx
  host: chat-app.local

ci:
  enabled: true
  namespace: ci-cd
  serviceAccount: argo-ci-sensor
  workflowTemplate: docker-gitops
  repository: ashish-splite/agentic-ui
  branch: main
  gitopsRepo: https://github.com/ashish-splite/argo-infra.git
  gitopsBranch: main
  valuesFile: applications/chat-app/chart/values.yaml
