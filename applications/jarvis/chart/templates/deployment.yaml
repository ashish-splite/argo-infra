apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  {{- if and .Values.reloader.enabled .Values.externalSecret.enabled }}
  annotations:
    secret.reloader.stakater.com/reload: {{ .Values.externalSecret.targetSecretName | quote }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --app
            - http
            {{- if .Values.externalSecret.enabled }}
            - --config
            - {{ printf "%s/%s" (trimSuffix "/" .Values.externalSecret.mountPath) .Values.externalSecret.configKey | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          {{- if .Values.resources }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- end }}
          {{- if .Values.externalSecret.enabled }}
          volumeMounts:
            - name: app-config
              mountPath: {{ .Values.externalSecret.mountPath | quote }}
              readOnly: true
          {{- end }}
          {{- if .Values.env }}
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}
      {{- if .Values.externalSecret.enabled }}
      volumes:
        - name: app-config
          secret:
            secretName: {{ .Values.externalSecret.targetSecretName }}
            items:
              - key: {{ .Values.externalSecret.configKey | quote }}
                path: {{ .Values.externalSecret.configKey | quote }}
      {{- end }}
