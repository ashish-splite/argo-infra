replicaCount: 1

image:
  repository: thedarkest22/ai-agent  # Docker Hub
  tag: "latest"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 3000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

externalSecret:
  enabled: true
  refreshInterval: 1h
  secretStoreName: vault-backend
  remoteKey: jarvis/app
  targetSecretName: jarvis-env

env:
  NODE_ENV: production
  LOG_LEVEL: info

ingress:
  enabled: true
  className: nginx
  host: jarvis.local
