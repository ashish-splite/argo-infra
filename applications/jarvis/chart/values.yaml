replicaCount: 1
image:
  repository: thedarkest22/jarvis # Docker Hub
  tag: "1c82929"
  pullPolicy: Always
service:
  type: ClusterIP
  port: 3000
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
externalSecret:
  enabled: true
  refreshInterval: 1m
  secretStoreName: vault-backend
  remoteKey: jarvis/app
  targetSecretName: jarvis-env
# Stakater Reloader restarts the Deployment when the ESO-managed Secret changes.
reloader:
  enabled: true
env:
  NODE_ENV: production
  LOG_LEVEL: info
ingress:
  enabled: true
  className: nginx
  host: jarvis.local

# CI trigger. Lives with the app so it is created and removed alongside it.
ci:
  enabled: true
  namespace: ci-cd
  serviceAccount: argo-ci-sensor
  workflowTemplate: docker-gitops
  repository: ashish-splite/ai-agent-ts
  branch: main
  gitopsRepo: https://github.com/ashish-splite/argo-infra.git
  gitopsBranch: main
  valuesFile: applications/jarvis/chart/values.yaml
