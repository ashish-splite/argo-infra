apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stateful
spec:
  serviceName: stateful
  replicas: 2
  selector:
    matchLabels:
      app: stateful
  template:
    metadata:
      labels:
        app: stateful
    spec:
      initContainers:
        - name: initialize-content
          image: nginx:1.28-alpine
          command:
            - /bin/sh
            - -c
          args:
            - |
              if [ ! -f /data/index.html ]; then
                printf 'Persistent storage for %s\n' "$HOSTNAME" > /data/index.html
              fi
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: nginx
          image: nginx:1.28-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /usr/share/nginx/html
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: stateful-hostpath
        resources:
          requests:
            storage: 1Gi